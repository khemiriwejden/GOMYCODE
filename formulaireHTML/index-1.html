<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <label for="username">Name</label>
        <input type="text" id="username" maxlength="8" placeholder="type your name" value="mohamed" >
        <br><br>
        <label for="">Email</label>
        <input type="email">
        <br><br>
        <label for="">Password</label>
        <input type="password">
        <br><br>
        <label for="">Phone</label>
        <input type="number" min="10000000" max="99999999">
        <br><br>
        <label for="">birth date</label>
        <input type="date">
        <br><br>
        <label for="">time:</label>
        <input type="time">
        <br><br>
        <input type="checkbox">
        <label for="">Accept terms & policy</label>
        <br><br>
        <label for="">Gendre: </label>
        <input type="radio" name="gendre">Male
        <input type="radio" name="gendre">Female
        <br><br>
        <label for="">Civil State: </label>
        <select>
            <option>Select a state</option>
            <option >Single</option>
            <option selected>Married</option>
            <option>Divorced</option>
            <option>widow(er)</option>
        </select>
        <br><br>
        <input type="range" min="0" max="100">
        <input type="color" name="" id="">
        <br><br>
        <label for="">bio</label> <br>
        <textarea cols="100" rows="5" ></textarea>
        <br><br>
        <input type="submit" >
        <input type="reset" >
    </form>
</body>
</html>
